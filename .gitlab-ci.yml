---
# base ci reference is maintained in ci/include.yml, it enables simple includes
# from other yocto projects
include:
- local: ci/include.yml

# Common definitions
stages:
  - docker
  - test
  - build
  - deploy
  - toolchain

variables:
  TQEM_MACHINES: 'em310 em-aarch64'
  YOCTO_DOCKER_TAG: 'v1.3.0'

# Docker
Release Docker Images:
  stage: docker
  extends:
    - .docker-build
  # The 'all' make target is implicitly tested with 'release'; it is essential for local builds.
  script:
    - make -f docker.mk release
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        BUILD_TAG: 'mr-${CI_MERGE_REQUEST_IID}'
    - if: $TEST_DOCKER == 'true'
      variables:
        BUILD_TAG: 'test-${CI_COMMIT_REF_SLUG}'
    - if: $CI_COMMIT_TAG
      variables:
        BUILD_TAG: $CI_COMMIT_TAG
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      variables:
        BUILD_TAG: 'latest'

# Tests
Test yocto build from scratch:
  stage: test
  extends:
    - .internal-yocto-settings
  variables:
    SUBDIR_JOB: 'test'
    CLEAN_MODE: 'build'
    YOCTO_RECIPE: 'libtool-native'
  script:
    - make build TARGET=${YOCTO_RECIPE} TQEM_MACHINES=em-aarch64
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        YOCTO_DOCKER_TAG: 'mr-${CI_MERGE_REQUEST_IID}'
    - if: $TEST_DOCKER == 'true'
      variables:
        YOCTO_DOCKER_TAG: 'test-${CI_COMMIT_REF_SLUG}'
    - if: $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH

Gitleaks:
  extends: .gitleaks

Shell Linter:
  extends:
    - .lint-shell
    - .rule-include-development-branches

# Yocto Snapshot
Build and Deploy Core Snapshots:
  stage: build
  extends:
    - .internal-yocto-settings
  variables:
    SUBDIR_JOB: 'snapshot'
  script:
    - make clean-artifacts
    - make all
    - make snapshot-deploy-remote
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH || $FORCE_SNAPSHOT == 'true'
    - if: $TEST_DOCKER == 'true'
      variables:
        YOCTO_DOCKER_TAG: 'test-${CI_COMMIT_REF_SLUG}'

# Yocto Release
# Release builds of em-build are triggered by tags with the prefix 'em-build_'
.rule-yocto-release:
  rules:
    - if: $TEST_DOCKER == 'true' && $CI_COMMIT_TAG =~ /^em-build_/
      variables:
        YOCTO_DOCKER_TAG: 'test-${CI_COMMIT_REF_SLUG}'
    - if: $CI_COMMIT_TAG =~ /^em-build_/

Build Core-Image and Toolchain Release:
  stage: build
  extends:
    - .internal-yocto-settings
    - .rule-yocto-release
  variables:
    TQEM_EM_BUILD_VERSION: $CI_COMMIT_TAG
    SUBDIR_JOB: 'release'
    CLEAN_MODE: 'full'
  script:
    - make release

Deploy Core-Image and Toolchain Release:
  stage: deploy
  extends:
    - .internal-yocto-settings
    - .rule-yocto-release
  variables:
    TQEM_EM_BUILD_VERSION: $CI_COMMIT_TAG
    SUBDIR_JOB: 'release'
  script:
    - make mirror
    - make release-deploy-remote

# Trigger toolchain tests
Trigger Toolchain Build:
  stage: toolchain
  trigger:
    project: tq-em/public/build/toolchain
    strategy: depend
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    - if: $FORCE_SNAPSHOT == 'true'
